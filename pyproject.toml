[project]
name = "openexplainer"
version = "0.2.0"
description = "Open-source toolkit for narrated AI explainer videos: storyboards, user-made mascots, lip sync, sound design and FFmpeg rendering, driven by AI coding agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]

[project.urls]
Homepage = "https://github.com/Maria-Aleana-De-Leon/Open-Explainer"
Issues = "https://github.com/Maria-Aleana-De-Leon/Open-Explainer/issues"
Changelog = "https://github.com/Maria-Aleana-De-Leon/Open-Explainer/blob/main/CHANGELOG.md"

[project.scripts]
oex = "openexplainer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openexplainer"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "openexplainer/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E741"]   # style only: lambda assignments, short names like `l`
